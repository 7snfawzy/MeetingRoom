<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>شاشة حالة القاعة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#18212B; --muted:#6B7686; --line:#E3E8EF; --free:#1E9E6A; --busy:#D64545; --brand:#2C7AE5; }
  *{box-sizing:border-box; cursor:none;}
  html,body{height:100%; margin:0;}
  body{font-family:'Tajawal',sans-serif; background:#EEF1F5; color:var(--ink); overflow:hidden; user-select:none; -webkit-user-select:none;}

  #app{height:100vh; height:100dvh; display:grid; grid-template-columns:58% 42%;}

  /* ===== Status (full colour) ===== */
  .status{
    position:relative; display:flex; flex-direction:column; padding:2.4vh 3.2vw 3vh; color:#fff; overflow:hidden;
    background:linear-gradient(165deg,#25B57F 0%,#168A5B 100%); transition:background .5s;
  }
  .status[data-state="busy"]{background:linear-gradient(165deg,#E65A5A 0%,#B53030 100%);}
  .status[data-state="closed"]{background:linear-gradient(165deg,#7A8594 0%,#4B5563 100%);}
  .status::before{content:""; position:absolute; width:60vh; height:60vh; border-radius:50%; background:rgba(255,255,255,.07); inset-inline-end:-18vh; top:-16vh;}
  .status > *{position:relative;}
  .brand{align-self:flex-start; background:#fff; border-radius:12px; padding:.8vh 1.1vw; box-shadow:0 6px 18px rgba(0,0,0,.16);}
  .brand img{height:3.4vh; width:auto; display:block;}
  .room{margin-top:1.6vh; font-size:2.4vh; font-weight:700; opacity:.95;}
  .clock{font-size:7vh; font-weight:900; line-height:1.05; direction:ltr; text-align:right; font-variant-numeric:tabular-nums;}
  .date{font-size:2vh; opacity:.9;}
  .sp{flex:1;}
  .label{font-size:15vh; font-weight:900; line-height:1;}
  .sub{font-size:3.6vh; font-weight:500; margin-top:1.2vh; opacity:.97;}
  .now{margin-top:3vh; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.3); border-radius:20px; padding:2vh 1.8vw;}
  .now .k{font-size:2vh; opacity:.85;}
  .now .t{font-size:3.6vh; font-weight:900; margin-top:.3vh; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .now .m{font-size:2.5vh; opacity:.95; margin-top:.3vh;}
  .now .nx{margin-top:1.4vh; padding-top:1.4vh; border-top:1px solid rgba(255,255,255,.28); font-size:2.5vh; line-height:1.6;}
  .now .nx.only{margin-top:0; padding-top:0; border-top:none;}
  .offline{display:none; margin-top:1.6vh; padding:1vh 1vw; border-radius:10px; background:rgba(0,0,0,.3); font-size:2vh;}
  .offline.show{display:block;}

  /* ===== Right-hand info side: QR + today's agenda ===== */
  .side{display:flex; flex-direction:column; padding:3vh 2.4vw; gap:2.2vh; min-width:0;}
  .qr-card{
    background:#fff; border-radius:26px; padding:2vh 2vw; border:1px solid var(--line);
    box-shadow:0 8px 24px rgba(24,33,43,.07);
    display:flex; flex-direction:row; align-items:center; justify-content:space-between; gap:2vw;
  }
  .qr-text{flex:1; text-align:center; min-width:0;}
  .qr-title{font-size:2.9vh; font-weight:900;}
  .qr-sub{font-size:2.1vh; color:var(--muted); margin-top:.6vh;}
  #qr{flex:0 0 auto; padding:1.2vh; background:#fff; border:3px solid var(--ink); border-radius:18px; line-height:0;}
  #qr svg{width:26vh; height:26vh; display:block;}

  .ag-title{font-size:2.6vh; font-weight:900; margin-top:.4vh;}
  .ag{flex:1; min-height:0; display:flex; flex-direction:column; gap:1.1vh;}
  .row{flex:1 1 0; min-height:0; display:flex; align-items:center; gap:1.2vw; background:#fff; border:1px solid var(--line); border-radius:14px; padding:0 1.4vw; position:relative;}
  .row::before{content:""; position:absolute; inset-inline-start:0; top:22%; bottom:22%; width:5px; border-radius:5px; background:var(--free);}
  .row.booked::before{background:var(--busy);}
  .row.past{opacity:.5;}
  .row.past::before{background:#C5CCD6;}
  .row.now{outline:3px solid var(--brand); outline-offset:1px;}
  .row .tm{width:11vh; font-weight:900; font-size:2.3vh; font-variant-numeric:tabular-nums; flex-shrink:0;}
  .row .tx{flex:1; min-width:0; font-size:2.2vh; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .row .tx small{font-weight:500; color:var(--muted); margin-inline-start:.8vw; font-size:2vh;}
  .row.free .tx{color:var(--free);}
  .row .chip{font-size:1.7vh; font-weight:700; padding:.5vh 1vw; border-radius:999px; background:#DDF3E9; color:#12724C; white-space:nowrap;}
  .row .chip.wait{background:#FFF4DE; color:#B7791F;}

  /* portrait screens: stack */
  @media (max-aspect-ratio: 1/1){
    #app{grid-template-columns:1fr; grid-template-rows:58% 42%;}
    .status{padding:2vh 5vw 2vh;}
    .room{margin-top:1vh; font-size:2vh;}
    .clock{font-size:5.5vh;} .date{font-size:1.8vh;}
    .label{font-size:7.5vh;} .sub{font-size:2.6vh; margin-top:.6vh;}
    .now{margin-top:1.4vh; padding:1.2vh 4vw;} .now .t{font-size:2.8vh;} .now .m,.now .nx{font-size:1.9vh;} .now .k{display:none;}
    .side{flex-direction:row; padding:1.6vh 3vw; gap:3vw; align-items:stretch;}
    .qr-card{flex:0 0 42%; padding:1.6vh 2vw; flex-direction:column-reverse; justify-content:center; gap:1vh;}
    .qr-title{font-size:2.1vh;} .qr-sub{font-size:1.5vh;}
    #qr svg{width:min(18vh,32vw); height:min(18vh,32vw);}
    .ag-wrap{min-width:0;} .ag-title{font-size:2vh;}
    .row{padding:0 2vw; gap:2vw; overflow:hidden;} .row .tm{width:auto; font-size:1.7vh;} .row .tx{font-size:1.7vh;} .row .tx small{display:none;}
    .row .chip{font-size:1.3vh; padding:.3vh 1.2vw;}
  }
</style>
</head>

      while (buffer.getLengthInBits() % 8 != 0) {

      for (var x = 0; x < width; x += 1) {
        gif.setPixel(x, y, getPixel(x, y) );
      }
    }

    var b = byteArrayOutputStream();
    gif.write(b);

    var base64 = base64EncodeOutputStream();
    var bytes = b.toByteArray();
    for (var i = 0; i < bytes.length; i += 1) {
      base64.writeByte(bytes[i]);
    }
    base64.flush();

    return 'data:image/gif;base64,' + base64;
  };

  //---------------------------------------------------------------------
  // returns qrcode function.

  return qrcode;

// multibyte support
!function() {

  qrcode.stringToBytesFuncs['UTF-8'] = function(s) {
    // http://stackoverflow.com/questions/18729405/how-to-convert-utf8-string-to-byte-array
    function toUTF8Array(str) {
      var utf8 = [];
      for (var i=0; i < str.length; i++) {
        var charcode = str.charCodeAt(i);
        if (charcode < 0x80) utf8.push(charcode);
        else if (charcode < 0x800) {
          utf8.push(0xc0 | (charcode >> 6),
              0x80 | (charcode & 0x3f));
        }
        else if (charcode < 0xd800 || charcode >= 0xe000) {
          utf8.push(0xe0 | (charcode >> 12),
              0x80 | ((charcode>>6) & 0x3f),
              0x80 | (charcode & 0x3f));
        }
        // surrogate pair
        else {
          i++;
          // UTF-16 encodes 0x10000-0x10FFFF by
          // subtracting 0x10000 and splitting the
          // 20 bits of 0x0-0xFFFFF into two halves
          charcode = 0x10000 + (((charcode & 0x3ff)<<10)
            | (str.charCodeAt(i) & 0x3ff));
          utf8.push(0xf0 | (charcode >>18),
              0x80 | ((charcode>>12) & 0x3f),
              0x80 | ((charcode>>6) & 0x3f),
              0x80 | (charcode & 0x3f));

  if (typeof define === 'function' && define.amd) {
      define([], factory);
  } else if (typeof exports === 'object') {
      module.exports = factory();

    return qrcode;

</script>
<script>
(function(){
'use strict';
/* ---------- Settings ---------- */
const START_HOUR = 9, END_HOUR = 16;
const CONFIRM_WINDOW_MS = 2*3600*1000;
const REFRESH_MS = 20000, TICK_MS = 15000, RELOAD_MS = 6*3600*1000;
const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzsXkrvMDRe1CL77x6ltzWv32FlZjJtWIihndAR9-P-ReTNWFTmQMEp-Y9qIPPk-xTd/exec";
// Link inside the QR code. By default: index.html next to this page (same GitHub Pages folder).
const BOOKING_URL_FALLBACK = "https://7snfawzy.github.io/MeetingRoom/";

const AR_DAYS = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const AR_MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const $ = id => document.getElementById(id);

let todayCache = {}, loaded = false, online = true;

function fmtKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function hourLabel(h){ const p = h>=12?'م':'ص'; let x = h%12; if(x===0) x=12; return x+':00 '+p; }
function dayText(d){ return AR_DAYS[d.getDay()]+'، '+d.getDate()+' '+AR_MONTHS[d.getMonth()]; }
function esc(s){ const d = document.createElement('div'); d.textContent = (s==null?'':s); return d.innerHTML; }
function startMs(h){ const d = new Date(); d.setHours(h,0,0,0); return d.getTime(); }

/* ---------- QR code (generated on the device, no internet needed) ---------- */
function bookingUrl(){
  try{
    if(/^https?:$/.test(location.protocol)) return new URL('index.html', location.href).href.replace(/index\.html$/, '');
  }catch(e){}
  return BOOKING_URL_FALLBACK;
}
function drawQr(){
  const url = bookingUrl();
  try{
    const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
    $('qr').innerHTML = qr.createSvgTag({cellSize:6, margin:0, scalable:true});
  }catch(e){ console.error(e); $('qr').textContent = 'تعذر إنشاء الرمز'; }
}

/* ---------- Data ---------- */
async function refresh(){
  try{
    const res = await fetch(GAS_WEB_APP_URL+'?action=list&date='+fmtKey(new Date())+'&_t='+Date.now());
    const j = await res.json();
    if(j.status !== 'ok') throw new Error('bad');
    todayCache = j.bookings || {}; loaded = true; online = true;
  }catch(e){ console.error(e); online = false; }
  render();
}

function findNext(from){ for(let h=Math.max(from,START_HOUR); h<END_HOUR; h++) if(todayCache[h]) return h; return null; }
function live(){
  if(!loaded) return {state:'closed', label:'…', sub:''};
  const h = new Date().getHours();
  if(h < START_HOUR) return {state:'closed', label:'مغلقة', sub:'تبدأ الحجوزات '+hourLabel(START_HOUR), next:findNext(START_HOUR)};
  if(h >= END_HOUR) return {state:'closed', label:'مغلقة', sub:'انتهت ساعات الحجز لهذا اليوم', next:null};
  const cur = todayCache[h];
  if(cur){
    let e = h+1; while(e<END_HOUR && todayCache[e]) e++;
    return {state:'busy', label:'مشغولة', sub:'حتى '+hourLabel(e), cur, next:findNext(e)};
  }
  let n = h+1; while(n<END_HOUR && !todayCache[n]) n++;
  return {state:'free', label:'متاحة', sub: n<END_HOUR ? 'حتى '+hourLabel(n) : 'حتى نهاية الدوام '+hourLabel(END_HOUR), next: n<END_HOUR ? n : null};
}

function render(){
  const now = new Date();
  $('clock').textContent = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  $('date').textContent = dayText(now);

  const st = live();
  $('status').dataset.state = st.state;
  $('label').textContent = st.label;
  $('sub').textContent = st.sub;

  let html = '';
  if(st.state==='busy') html += '<div class="k">الاجتماع الحالي</div><div class="t">'+esc(st.cur.name)+'</div><div class="m">'+esc(st.cur.dept)+' · '+esc(st.cur.type)+'</div>';
  if(st.next != null){
    const n = todayCache[st.next];
    html += '<div class="nx'+(st.state==='busy'?'':' only')+'"><span style="opacity:.85">التالي: </span><b>'+hourLabel(st.next)+' – '+hourLabel(st.next+1)+'</b><br>'+esc(n.name)+' · '+esc(n.dept)+'</div>';
  }else if(loaded){
    html += '<div class="nx only" style="opacity:.9">لا توجد حجوزات قادمة اليوم</div>';
  }
  $('now').innerHTML = html; $('now').hidden = !html;
  $('offline').classList.toggle('show', !online);

  let rows = '';
  for(let h=START_HOUR; h<END_HOUR; h++){
    const b = todayCache[h], past = startMs(h)+3600000 <= now.getTime(), isNow = now.getHours()===h;
    let chip = '';
    if(b){
      if(b.confirmed) chip = '<span class="chip">✓ مؤكد</span>';
      else { const ms = startMs(h)-now.getTime(); if(ms>0 && ms<=CONFIRM_WINDOW_MS) chip = '<span class="chip wait">بانتظار التأكيد</span>'; }
    }
    rows += '<div class="row '+(b?'booked':'free')+(past?' past':'')+(isNow?' now':'')+'"><div class="tm">'+hourLabel(h)+'</div><div class="tx">'+
      (b ? esc(b.name)+'<small>'+esc(b.dept)+'</small>' : (past ? '—' : 'متاح'))+'</div>'+chip+'</div>';
  }
  $('ag').innerHTML = rows;
}

/* ---------- Keep the screen awake + self-heal ---------- */
async function keepAwake(){ try{ if('wakeLock' in navigator) await navigator.wakeLock.request('screen'); }catch(e){} }
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ keepAwake(); refresh(); } });

drawQr(); render(); refresh(); keepAwake();
setInterval(render, TICK_MS);
setInterval(refresh, REFRESH_MS);
setTimeout(()=> location.reload(), RELOAD_MS);   // fresh start every 6h (also picks up new versions)
})();
</script>
</body>
</html>
